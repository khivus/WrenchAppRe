[package]
name = "eve-wrench"
description = "EVE Online Settings Manager - Backup, restore, and sync settings"
version.workspace = true
edition.workspace = true
authors.workspace = true
default-run = "eve-wrench"

[dependencies]
eve-wrench-core.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
gpui-kit = "0.7"
rust-i18n = "4"

[features]
update-preview = []

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
blue-marshal = "1.0.1"
sha2 = "0.10"
gpui-kit = { version = "0.7", features = ["test-support"] }

[package.metadata.packager]
product-name = "EVE Wrench"
identifier = "com.timkunze.eve-wrench"
category = "Utility"
before-packaging-command = "cargo build --release -p eve-wrench"
icons = [
    "../../assets/icons/32x32.png",
    "../../assets/icons/128x128.png",
    "../../assets/icons/128x128@2x.png",
    "../../assets/icons/icon.icns",
    "../../assets/icons/icon.ico",
]

[package.metadata.packager.macos]
signing-identity = "-"
